name: Frontend Production Deploy

# Deployment triggered: 2026-02-24
# Purpose: Ensure frontend works with updated backend session configuration
# Expected: Proper cookie handling and session persistence 

on:
  push:
    branches:
      - prod
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-production-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL }}
      VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Rollup ships platform-specific optional deps. A lockfile produced on Alpine (musl) can omit
      # @rollup/rollup-linux-x64-gnu; ubuntu-latest is glibc and needs it (npm optional-deps bug #4828).
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          ROLLUP_VER=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VER}"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "📦 Checking dist folder contents:"
          ls -la dist
          echo ""
          echo "📊 Total build size:"
          du -sh dist
          echo ""
          echo "✅ Build verification complete"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_FRONTEND_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_FRONTEND_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Upload hashed static assets with long cache
      - name: Upload static assets (long cache)
        working-directory: frontend
        run: |
          echo "📤 Uploading static assets with long-term caching..."
          aws s3 sync dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      # Upload HTML files with no cache
      - name: Upload HTML files (no cache)
        working-directory: frontend
        run: |
          echo "📤 Uploading HTML files with no-cache policy..."
          aws s3 sync dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      # CloudFront cache invalidation
      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
      
      - name: Deployment summary
        run: |
          echo ""
          echo "✅ Frontend deployment completed successfully!"
          echo "📦 Build artifacts uploaded to S3: ${{ secrets.S3_FRONTEND_BUCKET }}"
          echo "🔄 CloudFront cache invalidated"
          echo "🌐 Changes will be live shortly"    